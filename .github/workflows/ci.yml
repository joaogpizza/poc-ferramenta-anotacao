name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci-validation:
    name: Code Quality and Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest PySide6

      - name: Install Qt6 tools for qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev

      - name: Run Ruff Formatter (Blocker)
        run: |
          ruff format --check .

      - name: Run Ruff Linter (Blocker)
        run: |
          ruff check .

      - name: Run qmllint
        run: |
          find src/ -name "*.qml" -exec pyside6-qmllint {} +

      - name: Run Unit Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest tests/unidade/